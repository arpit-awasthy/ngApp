<br>

<input [formControl]="name" />

<table>
  <thead>
    <tr>
      <td> Title </td>
    </tr>
  </thead>
  <tbody>
    @if(isArray(postData$ | async)) {
        @for(data of postData$ | async; track data.id)  {
        <tr>
            <td> {{data.title}}</td>
        </tr>
        }
    }   @else   {
            <tr>
                <td> {{(postData$ | async)?.title}}</td>
            </tr>
    }
  </tbody>
</table>
